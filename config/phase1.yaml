# Phase 1 configuration: exhaustive quantization-variant sweep.
# Fields marked VERIFY are environment-specific and must be confirmed/edited
# before running — they are not guesses about your setup, they are the
# actual knobs you need to point at your hardware and model source.

base_model:
  # DEVIATION FROM THE ORIGINAL PLAN, recorded here rather than silently
  # changed: no pre-converted F16 GGUF for TinyLlama-1.1B-Chat-v1.0 was
  # found on the HF Hub (checked TheBloke/TinyLlama-1.1B-Chat-v1.0-GGUF,
  # 2026-08-15 — finest available there is Q8_0). Converting from the
  # original transformers checkpoint via convert_hf_to_gguf.py would need
  # torch+transformers installed (heavy on ARM64, adds disk/bandwidth cost
  # under a tight SD-card budget) just to reproduce what Q8_0 already gives
  # us almost losslessly. So Q8_0 is used as the requantization SOURCE
  # instead of true F16 — a widely-accepted near-lossless proxy for this
  # purpose, but an explicit methodological choice, not an oversight.
  # Article Section 3.4/5.1 must state this plainly, not present it as F16.
  hf_repo: "TheBloke/TinyLlama-1.1B-Chat-v1.0-GGUF"
  hf_filename: "tinyllama-1.1b-chat-v1.0.Q8_0.gguf"
  local_path: "models/tinyllama-1.1b-chat-v1.0-q8_0-base.gguf"

# Quantization variants to sweep. Names must match llama-quantize's accepted
# type strings exactly (run `llama-quantize --help` on your build to confirm
# the exact set supported by your llama.cpp version).
quant_variants:
  - Q2_K
  - Q3_K_M
  - Q4_0
  - Q4_K_M
  - Q5_K_M
  - Q6_K
  - Q8_0

llama_cpp:
  # Path to the llama.cpp build's bin/ directory on this Raspberry Pi 5
  # (fkoraiche@192.168.100.63), confirmed 2026-08-15.
  bin_dir: "/home/fkoraiche/llama.cpp/build/bin"
  quantize_bin: "llama-quantize"
  bench_bin: "llama-bench"
  perplexity_bin: "llama-perplexity"

bench:
  threads: 4          # Pi 5 has 4 cores; this is the Phase 1 baseline, not the Phase 2 search
  n_prompt: 512        # prompt-processing tokens for llama-bench's pp test
  n_gen: 128           # generation tokens for llama-bench's tg test
  repetitions: 3       # llama-bench -r; median is more robust to thermal/OS jitter

perplexity:
  # Real wikitext-2-raw-v1 test split, downloaded from Salesforce/wikitext
  # on HF (converted from parquet to plain text), 2026-08-15: 1,285,622
  # chars. Confirmed via a real llama-perplexity run that ctx_size=512
  # requires >=1024 tokens minimum — this corpus clears that by a wide
  # margin (the bundled smoke sample, at 240 tokens, does not).
  corpus_path: "data/prompts/wikitext2_raw_test.txt"
  ctx_size: 512

output:
  results_dir: "results"
  models_dir: "models"
  table_csv: "results/phase1_table.csv"
  retained_yaml: "results/phase1_retained.yaml"

# Pareto selection: axes and direction ("max" = higher is better).
# Used to pick the non-dominated quant variants carried into Phase 2.
pareto_axes:
  quality: max     # computed as -perplexity in the script (lower PPL = higher quality)
  tokens_per_sec: max
  peak_rss_mb: min
